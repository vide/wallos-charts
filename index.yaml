  wallos:
  - annotations:
      artifacthub.io/changes: |
        - kind: fixed
          description: Persist the paths Wallos actually uses (db/ and images/uploads/logos/); 0.x mounted an unused directory and lost all data on every restart
        - kind: changed
          description: Pin the image to appVersion instead of latest, Recreate strategy, health probes, standard app.kubernetes.io labels
        - kind: added
          description: Optional backup CronJob shipping a validated SQLite snapshot plus logos to any rclone backend
