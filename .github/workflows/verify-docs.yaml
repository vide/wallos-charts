---
name: Lint and Test

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/**'

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install helm-docs
        run: |
          wget -qO helm-docs.deb https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.deb
          sudo dpkg -i helm-docs.deb

      # Same arguments as the pre-commit hook.
      - name: Generate docs
        run: helm-docs --chart-search-root=charts --template-files=README.md.gotmpl --output-file=../../README.md

      - name: Verify no changes
        run: |
          if [[ $(git status --porcelain) ]]; then
            echo "Documentation is out of date. Please run helm-docs locally and commit changes."
            git diff
            exit 1
          fi

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: helm/chart-testing-action@v2.8.0

      - name: Lint
        run: ct lint --all --validate-maintainers=false

      - uses: helm/kind-action@v1.15.0

      - name: Install
        run: ct install --all
